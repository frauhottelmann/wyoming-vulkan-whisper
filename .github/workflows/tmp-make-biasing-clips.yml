# TEMPORARY: shows what Whisper makes of the biasing clips. Removed before merge.
name: Try biasing clips (temporary)

on:
  push:
    branches:
      - claude/project-thread-cjp72i
    paths:
      - .github/workflows/tmp-make-biasing-clips.yml
      - tests/test_biasing.py
      - tests/biasing/**

jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Try them
        run: |
          script/setup --dev --hass
          .venv/bin/python3 -m pytest tests/test_biasing.py -s -v 2>&1 | grep -v "unknown token" | grep -E "^[a-z]+: |PASSED|FAILED|Error|still heard|already" | head -60
